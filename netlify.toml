[build]
  command = "npx expo export --platform web"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Expo Router est exporté en SPA : les fichiers existants restent servis tels quels,
# tandis qu'une URL dynamique est rendue par le routeur client.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
